<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="kinetix-canvas"></canvas>

    
    <div class="dashboard-overlay">
  
        
        <div class="widget-panel" id="music-panel">
            <h3>Music Player</h3>
            <div class="audio-player">
                
                <input type="text" id="song-search" placeholder="Search playlist..." autocomplete="off">

                <div class="track-info">
                    <span id="track-name">Loading...</span>
                </div>


                <div class="player-controls">
                    <button id="prev-btn" class="neon-btn small-btn">⏮</button>
                    <button id="play-btn" class="neon-btn">▶</button>
                    <button id="next-btn" class="neon-btn small-btn">⏭</button>
                </div>

                <ul id="playlist"></ul>

                <audio id="bg-music"></audio>
            </div>

            <div class="widget-panel" id="globe-panel">
                <div id="globe-viz"></div>
            </div>
            
        </div>

        
        <div class="center-column">

            <h1 class="brand-title">Kinetix</h1>
            
            
            <form class="search-box" action="https://www.google.com/search" method="GET">
                <input type="text" name="q" placeholder="search here..." autocomplete="off" autofocus>
                <button type="submit">🔍</button>
            </form>

            
            <div class="shortcuts">
                <a href="https://youtube.com" class="shortcut-item">
                <div class="shortcut-icon">📺</div>
                    <span>YouTube</span>
                </a>
                <a href="https://github.com" class="shortcut-item">
                    <div class="shortcut-icon">🐙</div>
                        <span>GitHub</span>
                </a>
                <a href="https://app.slack.com" class="shortcut-item">
                    <div class="shortcut-icon">💬</div>
                    <span>Slack</span>
                </a>
            </div>
        </div>

        
        <div class="right-column">
            <div class="widget-panel">
                <h3>Weather</h3>
                <p id="weather-temp">--&deg;</p>
                <p id="weather-desc">Locating...</p>
            </div>
    
            <div class="widget-panel" style="margin-top: 20px;">
                <h3 id="month-year">Month Year</h3>
                <div class="calendar-container">
                    <ul class="weeks">
                        <li>S</li><li>M</li><li>T</li><li>W</li><li>T</li><li>F</li><li>S</li>
                    </ul>
                    <ul class="days" id="calendar-days">
                    </ul>
                </div>
            </div>

            <div class="widget-panel" id="notepad-panel">
                <h3>Terminal Log</h3>
                <textarea id="hacker-notes" placeholder=">_ enter system notes..."></textarea>
            </div>

        </div>

    </div>


    <script src="https://unpkg.com/globe.gl"></script>
    <script src="script.js"></script>
</body>
</html>
