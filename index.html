<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="kinetix-canvas"></canvas>

    
    <div class="dashboard-overlay">
  
        
        <div class="widget-panel">
            <h3>Music Player</h3>
            <div class="audio-player">
                <audio id="bg-music" loop>
                    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
                </audio>

                <div class="track-info">
                    <span id="track-name">stardance_synth.mp3</span>
                </div>

                <button id="play-btn" class="neon-btn">▶ PLAY</button>
            </div>
        </div>

        
        <div class="center-column">

            <h1 class="brand-title">Kinetix</h1>
            
            
            <form class="search-box" action="https://www.google.com/search" method="GET">
                <input type="text" name="q" placeholder="search here..." autocomplete="off" autofocus>
                <button type="submit">🔍</button>
            </form>

            
            <div class="shortcuts">
                <a href="https://youtube.com" class="shortcut-item">
                <div class="shortcut-icon">📺</div>
                    <span>YouTube</span>
                </a>
                <a href="https://github.com" class="shortcut-item">
                    <div class="shortcut-icon">🐙</div>
                        <span>GitHub</span>
                </a>
                <a href="https://app.slack.com" class="shortcut-item">
                    <div class="shortcut-icon">💬</div>
                    <span>Slack</span>
                </a>
            </div>
        </div>

        
        <div class="right-column">
            <div class="widget-panel">
                <h3>Weather</h3>
                <p id="weather-temp">--&deg;</p>
                <p id="weather-desc">Locating...</p>
            </div>
    
            <div class="widget-panel" style="margin-top: 20px;">
                <h3 id="month-year">Month Year</h3>
                <div class="calendar-container">
                    <ul class="weeks">
                        <li>S</li><li>M</li><li>T</li><li>W</li><li>T</li><li>F</li><li>S</li>
                    </ul>
                    <ul class="days" id="calendar-days">
                    </ul>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
